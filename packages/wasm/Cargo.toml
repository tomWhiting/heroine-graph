[package]
name = "graphmother-wasm"
version = "0.3.0"
edition = "2024"
authors = ["GraphMother Contributors"]
description = "WASM module for GraphMother - graph algorithms and data structures"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tomWhiting/graphmother"
keywords = ["graph", "visualization", "wasm", "webgpu", "graphmother"]
categories = ["visualization", "wasm", "algorithms"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
petgraph = { version = "0.8.3", default-features = false, features = ["stable_graph"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]
