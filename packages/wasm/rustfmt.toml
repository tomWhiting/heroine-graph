# GraphMother - Rustfmt Configuration
#
# Stable-channel options only. Everything rustfmt gates behind nightly has been
# removed: those keys were silently ignored on stable and only produced a wall
# of warnings on every `cargo fmt` run.

edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
short_array_element_width_threshold = 10
fn_params_layout = "Tall"
match_arm_leading_pipes = "Never"
match_block_trailing_comma = false
merge_derives = true
remove_nested_parens = true
reorder_imports = true
reorder_modules = true
use_try_shorthand = false
use_field_init_shorthand = false
force_explicit_abi = true
disable_all_formatting = false
