name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    name: Deno (check / lint / fmt / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Materializes the lockfile-pinned node_modules the tasks resolve against.
      - name: Install dependencies
        run: deno install

      # packages/wasm/pkg is gitignored, and packages/core/mod.ts resolves
      # `@graphmother/wasm` through it, so the bindings must exist before any
      # type check or test can run. wasm-pack comes from its official prebuilt
      # installer (no compile step).
      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build WASM bindings
        run: deno task build:wasm

      - name: Type check core
        run: deno task check

      # The wrapper sources use extensionless imports (npm/bundler convention),
      # hence --unstable-sloppy-imports. Only the React entry is checkable this
      # way: the Vue and Svelte entries pull in .vue/.svelte SFCs, which Deno
      # cannot parse. Those are covered by `vue-tsc`/`svelte-check` via each
      # package's own tsconfig.json.
      - name: Type check React wrapper
        run: deno check --unstable-sloppy-imports packages/react/src/index.ts

      - name: Lint
        run: deno task lint

      - name: Format check
        run: deno fmt --check

      # Runs headless: the WebGPU-backed tests skip when no adapter is present.
      - name: Test
        run: deno task test

  rust:
    name: Rust (test / clippy / fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wasm
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
